[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edurage"
version = "0.0.1"
description = "Educational retrieval-augmented generation service."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "pydantic-settings",
    "pyyaml",
    "httpx",
    "python-dotenv",
    "pymupdf",
    "python-pptx",
    "openai>=1.40",
    "qdrant-client",
    "minio",
    "sqlalchemy>=2",
    "psycopg[binary]",
    "python-multipart",
    "tenacity",
]

[project.optional-dependencies]
ocr = [
    "Pillow>=10",
    "pytesseract>=0.3.13",
]
dev = [
    "pytest>=8",
    "pytest-asyncio",
    "pytest-cov",
    "ruff",
    "mypy",
    "pre-commit",
    "respx",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
    "integration: requires running external services",
]
